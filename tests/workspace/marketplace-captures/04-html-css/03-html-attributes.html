<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Medusa.void | HTML Attribute Colors</title>
    <link rel="stylesheet" href="02-css.css" />
</head>
<body>
    <!-- Pastel blue: IDs, class names, ARIA references. -->
    <main id="workspace" class="theme-preview" aria-labelledby="theme-title">
        <h1 id="theme-title">Medusa.void</h1>

        <!-- Pastel mint: resource paths and links. -->
        <a href="./colors.html" class="theme-link" role="link">Explore palette</a>
        <img src="./theme-preview.png" alt="OLED editor preview" loading="lazy" />

        <!-- Pastel caramel: types, roles, states, and options. -->
        <button type="button" data-status="active" aria-expanded="false">
            Open preview
        </button>
        <input type="search" id="theme-search" autocomplete="off" />
    </main>
</body>
</html>
